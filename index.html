<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#222d34"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>MachDefense</title><link rel="stylesheet" href="style.css"><body>
<main id="launcher"><h1>MACH DEFENSE</h1><p id="status">Preparing offline play…</p><progress id="progress" max="100" value="0"></progress><button id="install" hidden>INSTALL GAME</button><p id="installHelp" tabindex="-1" role="status">Install for offline play. On iPhone or iPad, use Share → Add to Home Screen.</p><button id="play" disabled>PLAY IN BROWSER</button><p>Progress is saved on this device. Keep a recovery code before removing website data.</p></main>
<canvas id="game" tabindex="0" hidden></canvas>
<textarea id="transferInput" aria-label="Recovery code" spellcheck="false" autocapitalize="off" autocomplete="off" maxlength="120000" hidden></textarea>
<dialog id="textDialog"><form method="dialog"><label id="textLabel" for="textInput">PROFILE NAME</label><textarea id="textInput" spellcheck="false"></textarea><div><button value="cancel">CANCEL</button><button value="ok">OK</button></div></form></dialog>
<div id="error" hidden role="alert"></div><script src="storage.js"></script><script src="audio.js"></script><script src="app.js"></script></body></html>
